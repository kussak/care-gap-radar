name: care_gap_radar
version: "0.1.0"
config-version: 2
profile: care_gap_radar

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  care_gap_radar:
    staging:
      # tables, not views: downstream models scan these repeatedly and the observations CSV is ~280 MB
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  care_gap_radar:
    +schema: seeds
