version: 2

models:
  - name: stg_patients
    columns:
      - name: patient_id
        data_tests: [unique, not_null]
      - name: birth_date
        data_tests: [not_null]
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ["m", "f"]

  - name: stg_encounters
    columns:
      - name: encounter_id
        data_tests: [unique, not_null]
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_patients')
                field: patient_id
      - name: started_at
        data_tests: [not_null]
      - name: payer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payers')
                field: payer_id
      - name: encounter_class
        data_tests:
          - accepted_values:
              arguments:
                values: [ambulatory, wellness, outpatient, urgentcare, emergency, inpatient, home, virtual, snf, hospice]

  - name: stg_conditions
    columns:
      - name: patient_id
        data_tests: [not_null]
      - name: start_date
        data_tests: [not_null]
      - name: condition_code
        data_tests: [not_null]

  - name: stg_observations
    columns:
      - name: patient_id
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]
      - name: loinc_code
        data_tests: [not_null]

  - name: stg_medications
    columns:
      - name: patient_id
        data_tests: [not_null]
      - name: started_at
        data_tests: [not_null]

  - name: stg_payers
    columns:
      - name: payer_id
        data_tests: [unique, not_null]
      - name: ownership
        data_tests:
          - accepted_values:
              arguments:
                values: [government, private, no_insurance]
