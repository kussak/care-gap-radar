version: 2

seeds:
  - name: chronic_condition_codes
    description: >
      SNOMED codes per chronic condition group, found by querying condition descriptions in the
      Synthea data. Prediabetes (714628002), hyperglycemia (80394007) and acute bronchitis
      (10509002) are deliberately excluded. Diabetes complication codes have
      requires_confirmation = true: Synthea attaches them to some hypertensive patients who have
      no diabetes code, no A1c and no diabetes medication, so they only count as diabetes when
      backed by a diabetes medication or an A1c >= 6.5% before the index date (a normal A1c is
      evidence against diabetes, so it does not confirm).
    config:
      column_types:
        snomed_code: varchar
        requires_confirmation: boolean
    columns:
      - name: snomed_code
        data_tests: [unique, not_null]
      - name: requires_confirmation
        data_tests: [not_null]
      - name: condition_group
        data_tests:
          - accepted_values:
              arguments:
                values: [diabetes, hypertension, chf, copd, asthma, ckd, depression, obesity]

  - name: diabetes_medication_codes
    description: RxNorm codes for glucose-lowering medications present in the Synthea data.
    config:
      column_types:
        rxnorm_code: varchar
    columns:
      - name: rxnorm_code
        data_tests: [unique, not_null]
